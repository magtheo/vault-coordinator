coordinator:
  port: 8650
  database: coordinator.db

vikunja:
  url: "http://127.0.0.1:3456/api/v1"
  token: "${VIKUNJA_TOKEN}"

radicale:
  url: "http://127.0.0.1:5232"
  username: "user"
  password: "${RADICALE_PASSWORD}"
  calendar: "vault-time-blocks"

# V-065a calendars registry — reads fan out across these; writes are
# rejected (403) unless writable: true. Absent → defaults derived from
# radicale.calendar + ics_subscriptions.
calendars:
  - id: "time-blocks"
    collection: "vault-time-blocks"
    display_name: "Vault Time Blocks"
    symbol: "\u25AA"      # ▪
    writable: true
  - id: "personal"
    collection: "personal"
    display_name: "Personal"
    symbol: "\u25CF"      # ●
    writable: true
    provision: true       # MKCOL at startup if missing
  # read-only replicas (e.g. ICS subscription collections) go here with
  # writable: false — enforced by the API, never written.

ntfy:
  url: "http://127.0.0.1:8090"
  topic: "vault-reminders"
  username: "user"
  password: "${NTFY_PASSWORD}"

repos:
  - id: "evershift"
    name: "Evershift"
    path: "/home/user/Documents/repos/Evershift"
  - id: "dev-server"
    name: "dev-server"
    path: "/home/user/Documents/repos/dev-server"

sync_interval_seconds: 300

# ── Chat (Phase 7 + V-074) ─────────────────────────────────────────────
chat:
  base_url: http://127.0.0.1:8642/v1   # LLM lane: OpenAI-compatible endpoint
  model: claude-sonnet-4
  timeout_s: 90
  # V-074/D034: general-tier engine. "hermes" → every general thread runs
  # the FULL Hermes agent (memory + tools, one persistent session per
  # thread — same brain as the Telegram lane). null → classic one-shot
  # LLM. Topic/workspace tiers are never agent-backed by this flag.
  agent_backend: null
  agent_timeout_s: 100             # must stay under the phone's 120s IO timeout

# ── Agents (Phase 8, V-052) — backends must be localhost-only ──────────
agents:
  enabled: true                    # feature flag; false → /v1/agents* 501
  default_backend: opencode        # used when dispatch omits backend
  warren:
    enabled: true
    base_url: http://127.0.0.1:8660
    token: ${WARREN_API_TOKEN}
  opencode:
    enabled: true
    base_url: http://127.0.0.1:14096
    model_id: glm-5.2              # provider catalog: glm-4.7|glm-5-turbo|glm-5.2 (glm-5.1 removed)
    provider_id: zai-coding-plan
    default_directory: /tmp        # fallback when project_ref unmapped
  hermes:                          # V-073/D033 — trusted lane, unsandboxed
    enabled: true
    base_url: http://127.0.0.1:8642  # the Hermes agent API server (chat surface host)
    token: ""                      # bearer only if api_server auth is enabled
  projects:                        # project_ref → per-backend binding
    kodeverket:
      warren_project_id: prj_xxx
      opencode_directory: /home/user/Documents/repos/main
